[project]
name = "imrf-eyetracking"
version = "0.1.0"
description = "IMRF spatial audio eye-tracking acquisition and analysis tools"
authors = [{ name = "Eduardo Villar Ortega", email = "eduardo.villar-ortega@chuv.ch" }]
requires-python = ">=3.10"
dependencies = [
    # GUI
    "PySide6>=6.5.0",
    "jupyterlab>=4.0.0",
    "ipykernel>=6.0.0",

    # Data handling
    "pandas>=2.0.0,<3.0.0",
    "numpy>=1.24.0,<2.0.0",
    "matplotlib>=3.7.0,<4.0.0",
    "scipy>=1.10.0",
    "huggingface_hub>=0.23.0",

    # Pupil Labs eye tracker
    "pupil-labs-realtime-api>=1.7.3",
    "pupil-labs-neon-recording>=2.0.0",
    "real-time-screen-gaze>=1.1.2",
    "pupil-apriltags>=1.0.4",

    # Computer vision (homography, perspective transform)
    "opencv-python>=4.8.0",

    # LSL streaming for data synchronization
    "pylsl>=1.16.0",
    "pyxdf>=1.16.0",
]

[project.optional-dependencies]
dev = [
    # 1.13+ avoids internal errors when type-checking modules that import matplotlib.
    "mypy>=1.13.0",
]

[project.gui-scripts]
imrf-eyetracking = "main:main"

[tool.setuptools]
packages = ["libs", "libs.analysis", "tests"]
py-modules = [
    "main",
    "ui_components_ui",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
disallow_untyped_defs = false
# Enable per-package once more modules are annotated (heavy with numpy/scipy).
check_untyped_defs = false
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["cv2.*"]
ignore_missing_imports = true
